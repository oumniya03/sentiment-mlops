name: MLOps Sentiment - Register & Deploy

on:
  push:
    branches: [main]
    paths:
      - "models/**"
      - "src/**"
      - "pipelines/**"
      - "config.yml"
  workflow_dispatch:
    inputs:
      deploy_batch:
        description: "Redéployer aussi le batch endpoint (pas seulement enregistrer le modèle)"
        required: false
        default: "false"

jobs:
  register-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          pip install azure-ai-ml azure-identity pyyaml

      - name: Connexion à Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Enregistrer le modèle dans le registre Azure ML
        run: |
          python pipelines/training_pipeline.py --register-only

      - name: Déployer le batch endpoint (si demandé manuellement)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_batch == 'true'
        run: |
          python pipelines/deploy_batch.py --model-version 1
